[package]
name = "mediaqa"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
notify = "6.1"
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = "0.12"
toml = "1.1.2"
walkdir = "2.5.0"

[[bin]]
name = "mediaqa"
path = "src/main.rs"
