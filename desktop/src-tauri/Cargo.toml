[package]
name = "mediaqa-desktop"
version = "0.1.0"
description = "Media QA Studio desktop operator station"
edition = "2021"

[lib]
name = "mediaqa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mediaqa = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
